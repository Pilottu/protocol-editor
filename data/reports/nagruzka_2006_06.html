<head>

<table>

        <tr>
            <th>Исследование</th>
            
            <th>Всего</th>
        </tr>
    </thead>
    <tbody>
        
        <tr>
            <td class="left"><b>ИТОГО</b></td>
            
            <td><b>0</b></td>
        </tr>
    </tbody>
</table>

<div class="footer">
    Зав. отделением ______________
</div>

</body>
</html>
